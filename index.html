<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectral | Professional Chromatic Extraction</title>
    <!-- Tailwind CSS (via CDN for speed in this demo, but structure allows local build) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/styles/main.css">
</head>
<body class="bg-[#07090e] text-slate-300 min-h-screen flex flex-col items-center p-6 md:p-12 selection:bg-blue-500/30">

    <header class="mb-20 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-[1.5rem] bg-gradient-to-br from-blue-600 to-indigo-700 mb-8 shadow-2xl shadow-blue-500/20 border border-white/10">
            <span class="text-white font-black text-3xl">S</span>
        </div>
        <h1 class="text-6xl font-black tracking-[0.25em] text-white mb-4">SPECTRAL</h1>
        <div class="flex items-center justify-center gap-6">
            <span class="h-[1px] w-16 bg-slate-800/50"></span>
            <p class="text-slate-500 uppercase text-[11px] tracking-[0.6em] font-extrabold">Professional Color Extraction</p>
            <span class="h-[1px] w-16 bg-slate-800/50"></span>
        </div>
    </header>

    <main class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-16 items-start">
        <!-- left: Workspace -->
        <section class="lg:col-span-7 space-y-10">
            <div id="drop-zone" class="group relative border-2 border-dashed border-slate-800/50 rounded-[3rem] p-24 flex flex-col items-center justify-center transition-all hover:border-blue-500/30 hover:bg-blue-500/[0.03] cursor-pointer overflow-hidden backdrop-blur-sm">
                <div class="absolute inset-0 bg-gradient-to-tr from-blue-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="text-6xl mb-8 filter grayscale group-hover:grayscale-0 transition-all duration-700 group-hover:scale-110 group-hover:-rotate-3">🎨</div>
                <p class="text-slate-400 font-semibold tracking-tight text-xl text-center">
                    Drag your vision here or <br/>
                    <span class="text-blue-500 group-hover:underline underline-offset-4 decoration-blue-500/30">browse files</span>
                </p>
                <input type="file" id="file-input" class="hidden" accept="image/*">
            </div>

            <div id="preview-container" class="hidden group relative rounded-[3rem] overflow-hidden border border-white/5 shadow-[0_0_100px_rgba(59,130,246,0.1)] glass-effect p-8">
                <canvas id="main-canvas" class="w-auto max-w-full mx-auto block rounded-2xl shadow-2xl"></canvas>
                <button id="reset-btn" class="absolute top-12 right-12 bg-black/60 backdrop-blur-xl text-white w-10 h-10 flex items-center justify-center rounded-full hover:bg-red-500/80 transition-all border border-white/10 opacity-0 group-hover:opacity-100 scale-90 group-hover:scale-100 scale-transition">✕</button>
            </div>
        </section>

        <!-- right: Results -->
        <section class="lg:col-span-5 lg:sticky lg:top-12">
            <div class="flex items-center justify-between mb-8 border-b border-white/5 pb-8">
                <div class="space-y-2">
                    <h2 class="text-xs font-black text-slate-400 uppercase tracking-[0.5em]">Optical Analysis</h2>
                    <div class="flex items-center gap-3">
                        <p class="text-[10px] text-slate-600 font-bold uppercase tracking-widest">Spectral v1.0</p>
                        <span id="status-tag" class="text-[9px] px-2 py-0.5 rounded bg-slate-800/50 text-slate-500 font-bold uppercase tracking-widest italic transition-all">Standby</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button id="copy-all-btn" class="hidden text-[10px] px-4 py-2 rounded-full border border-white/5 hover:border-blue-500/30 hover:bg-blue-500/5 transition-all text-slate-400 font-black uppercase tracking-tighter">Copy All</button>
                    <button id="export-css-btn" class="hidden text-[10px] px-4 py-2 rounded-full border border-blue-500/20 bg-blue-500/10 hover:bg-blue-500/20 transition-all text-blue-400 font-black uppercase tracking-tighter">Export CSS</button>
                </div>
            </div>
            
            <div id="palette-container" class="grid grid-cols-1 gap-6">
                <!-- Fallback content -->
                <div class="py-24 text-center border border-dashed border-slate-800/50 rounded-[2.5rem] bg-white/[0.01]">
                    <div class="inline-block w-8 h-8 rounded-full border-2 border-slate-800 border-t-blue-500 animate-spin mb-4 hidden" id="spinner"></div>
                    <p class="text-slate-600 text-sm font-semibold italic tracking-wide">Waiting for optical data...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="mt-32 pb-12 text-center border-t border-white/5 w-full pt-12">
        <p class="text-[9px] font-black text-slate-700 uppercase tracking-[0.8em]">Spectral &copy; 2026 / Interactive Lab</p>
    </footer>

    <script type="module" src="src/main.js"></script>
</body>
</html>
