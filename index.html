<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectral | Professional Chromatic Extraction</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <!-- Tailwind CSS (via CDN for speed in this demo, but structure allows local build) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/styles/main.css">
</head>
<body class="bg-[#07090e] text-slate-300 min-h-screen flex flex-col items-center p-6 md:p-12 selection:bg-blue-500/30">

    <header class="mb-12 md:mb-20 text-center px-4">
        <div class="inline-flex items-center justify-center w-14 h-14 md:w-16 md:h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-700 mb-6 md:mb-8 shadow-2xl shadow-blue-500/20 border border-white/10">
            <span class="text-white font-black text-2xl md:text-3xl">S</span>
        </div>
        <h1 class="text-3xl sm:text-4xl md:text-6xl font-black tracking-[0.15em] md:tracking-[0.25em] text-white mb-4">SPECTRAL</h1>
        <div class="flex items-center justify-center gap-4 md:gap-6">
            <span class="hidden sm:block h-[1px] w-12 md:w-16 bg-slate-800/50"></span>
            <p class="text-slate-500 uppercase text-[9px] md:text-[11px] tracking-[0.4em] md:tracking-[0.6em] font-extrabold">Professional Color Extraction</p>
            <span class="hidden sm:block h-[1px] w-12 md:w-16 bg-slate-800/50"></span>
        </div>
    </header>

    <main class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-16 items-start">
        <!-- left: Workspace -->
        <section class="lg:col-span-7 space-y-10">
            <div id="drop-zone" class="group relative border-2 border-dashed border-slate-800/50 rounded-[3rem] p-12 md:p-24 flex flex-col items-center justify-center transition-all hover:border-blue-500/30 hover:bg-blue-500/[0.03] cursor-pointer overflow-hidden backdrop-blur-sm">
                <div class="absolute inset-0 bg-gradient-to-tr from-blue-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="text-6xl mb-8 filter grayscale group-hover:grayscale-0 transition-all duration-700 group-hover:scale-110 group-hover:-rotate-3">🎨</div>
                <p class="text-slate-400 font-semibold tracking-tight text-xl text-center">
                    Drag your vision here or <br/>
                    <span class="text-blue-500 group-hover:underline underline-offset-4 decoration-blue-500/30">browse files</span>
                </p>
                <input type="file" id="file-input" class="hidden" accept="image/*">
            </div>

            <div id="preview-container" class="hidden group relative rounded-[3rem] overflow-hidden border border-white/5 shadow-[0_0_100px_rgba(59,130,246,0.1)] glass-effect p-8">
                <canvas id="main-canvas" class="w-auto max-w-full mx-auto block rounded-2xl shadow-2xl"></canvas>
                <button id="reset-btn" class="absolute top-12 right-12 bg-black/60 backdrop-blur-xl text-white w-10 h-10 flex items-center justify-center rounded-full hover:bg-red-500/80 transition-all border border-white/10 opacity-0 group-hover:opacity-100 scale-90 group-hover:scale-100 scale-transition">✕</button>
            </div>
        </section>

        <!-- right: Results -->
        <section class="lg:col-span-5 lg:sticky lg:top-12">
            <div class="flex items-center justify-between mb-8 border-b border-white/5 pb-8">
                <div class="space-y-2">
                    <h2 class="text-xs font-black text-slate-400 uppercase tracking-[0.5em]">Optical Analysis</h2>
                    <div class="flex items-center gap-3">
                        <p class="text-[10px] text-slate-600 font-bold uppercase tracking-widest">Spectral v1.0</p>
                        <span id="status-tag" class="text-[9px] px-2 py-0.5 rounded bg-slate-800/50 text-slate-500 font-bold uppercase tracking-widest italic transition-all">Standby</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button id="copy-all-btn" class="hidden text-[10px] px-4 py-2 rounded-full border border-white/5 hover:border-blue-500/30 hover:bg-blue-500/5 transition-all text-slate-400 font-black uppercase tracking-tighter">Copy All</button>
                    <button id="export-css-btn" class="hidden text-[10px] px-4 py-2 rounded-full border border-blue-500/20 bg-blue-500/10 hover:bg-blue-500/20 transition-all text-blue-400 font-black uppercase tracking-tighter">Export CSS</button>
                </div>
            </div>
            
            <div id="palette-container" class="grid grid-cols-1 gap-6 mb-8">
                <!-- Fallback content -->
                <div class="py-24 text-center border border-dashed border-slate-800/50 rounded-[2.5rem] bg-white/[0.01]">
                    <div class="inline-block w-8 h-8 rounded-full border-2 border-slate-800 border-t-blue-500 animate-spin mb-4 hidden" id="spinner"></div>
                    <p class="text-slate-600 text-sm font-semibold italic tracking-wide">Waiting for optical data...</p>
                </div>
            </div>

            <button id="download-map-btn" class="hidden w-full py-5 rounded-[2rem] bg-gradient-to-r from-blue-600 to-indigo-700 text-white font-black uppercase tracking-[0.3em] text-[11px] shadow-2xl shadow-blue-500/20 hover:scale-[1.02] active:scale-[0.98] transition-all border border-white/10 group">
                Download Spectral Map
                <span class="ml-2 group-hover:translate-x-1 transition-transform inline-block">→</span>
            </button>
        </section>
    </main>

    <footer class="mt-32 pb-12 text-center border-t border-white/5 w-full pt-12 flex flex-col items-center gap-6">
        <p class="text-[9px] font-black text-slate-700 uppercase tracking-[0.8em]">Spectral &copy; 2026 / Interactive Lab</p>
        <div class="flex items-center gap-6">
            <a href="https://github.com/gabri98gim" target="_blank" rel="noopener noreferrer" class="text-slate-600 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.43.372.823 1.102.823 2.222 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.298 24 12c0-6.627-5.373-12-12-12"/></svg>
            </a>
            <a href="https://www.linkedin.com/in/gabriel-andreu-gimeno/" target="_blank" rel="noopener noreferrer" class="text-slate-600 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.761 0 5-2.239 5-5v-14c0-2.761-2.239-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
            </a>
        </div>
    </footer>

    <script type="module" src="src/main.js"></script>
</body>
</html>
